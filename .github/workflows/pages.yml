# Publishes the site to GitHub Pages (https://dunmaer.github.io/Xibka/) on every push to the
# working branch. One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/elegant-maxwell-kh7983, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://dunmaer.github.io/Xibka/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # the same game packed for itch.io, always at one public link:
  # https://github.com/Dunmaer/Xibka/releases/download/itch-latest/infernal-certificate-itch.zip
  itch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:itch
      - name: Publish the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist-itch && zip -qr ../infernal-certificate-itch.zip .)
          gh release view itch-latest >/dev/null 2>&1 || gh release create itch-latest \
            --title "Infernal Certificate for itch.io" --latest=false \
            --notes "Upload infernal-certificate-itch.zip to itch.io as an HTML project. Rebuilt on every update of the site."
          gh release upload itch-latest infernal-certificate-itch.zip --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
