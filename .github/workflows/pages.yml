# Publishes the site to GitHub Pages (https://dunmaer.github.io/Xibka/) on every push to the
# working branch. One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/elegant-maxwell-kh7983, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://dunmaer.github.io/Xibka/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # the same game packed for itch.io: Actions → the latest run → Artifacts → infernal-certificate-itch
  itch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: infernal-certificate-itch
          path: dist-itch
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
